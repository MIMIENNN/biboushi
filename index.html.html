<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Bibi ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff8fb1,#ffb6c1,#ffd6e8);
    overflow:hidden;
}

.container{
    background:white;
    padding:40px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
    width:90%;
    max-width:500px;
}

h1{
    color:#ff2d75;
    font-size:2.6rem;
    margin-bottom:15px;
}

p{
    font-size:1.4rem;
    color:#555;
    margin-bottom:30px;
}

button{
    border:none;
    padding:15px 35px;
    margin:10px;
    border-radius:50px;
    font-size:22px;
    cursor:pointer;
    color:white;
    background:#ff2d75;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
    background:#ff0f61;
}

#message{
    margin-top:25px;
    font-size:1.6rem;
    color:#ff2d75;
    font-weight:bold;
}

.heart{
    position:absolute;
    color:#ff4d88;
    animation:float 6s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-120px);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>💖 Hey Bibi 💖</h1>

    <p>
        Do you love me? 🥺💞❤️
    </p>

    <button onclick="love()">YES ❤️</button>
    <button onclick="love()">YESSSS 💖</button>

    <div id="message"></div>
</div>

<script>
function love(){
    document.getElementById("message").innerHTML =
    "Awwww!! 🥹❤️<br>I knew it!! 💖💞😘<br>I love you forever, Bibi! 💕🌹";
}

// Floating hearts
setInterval(function(){

    const heart=document.createElement("div");

    heart.className="heart";
    heart.innerHTML=["❤️","💖","💕","💘","💗"][Math.floor(Math.random()*5)];

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*35)+"px";
    heart.style.animationDuration=(3+Math.random()*3)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },6000);

},250);
</script>

</body>
</html>
